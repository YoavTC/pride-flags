on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2)"
        required: true
      mc_range:
        description: "Minecraft compatible version range (e.g. 26.1 or 26.1-26.2)"
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set names
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          VERSION="${{ github.event.inputs.version }}"
          MC_RANGE="${{ github.event.inputs.mc_range }}"
          PRETTY_NAME=$(echo "$REPO_NAME" | tr '-' ' ' | sed 's/\b\(.\)/\u\1/g')
          RELEASE_NAME="${REPO_NAME} v${VERSION} MC${MC_RANGE}"
          PACK_DESCRIPTION="${PRETTY_NAME} v${VERSION} MC${MC_RANGE}"
          echo "ZIP_NAME=${RELEASE_NAME}.zip" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "PACK_DESCRIPTION=${PACK_DESCRIPTION}" >> $GITHUB_ENV

      - name: Update pack.mcmeta
        run: |
          jq --arg name "${{ env.PACK_DESCRIPTION }}" \
            '.pack.description[0].text = $name + "\n"' \
            src/pack.mcmeta > tmp.json && mv tmp.json src/pack.mcmeta

      - name: Build zip
        run: |
          cd src
          zip -r "../${{ env.ZIP_NAME }}" .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "${{ env.ZIP_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes ""